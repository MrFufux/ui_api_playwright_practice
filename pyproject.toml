[project]
name = "test-automation-framework"
version = "0.1.0"
description = "Python test automation framework (UI: Playwright, API: httpx, runner: pytest)"
requires-python = ">=3.10"
dependencies = [
    "pytest==8.3.3",
    "pytest-playwright==0.6.2",
    "playwright==1.49.1",
    "pytest-html==4.1.1",
    "allure-pytest==2.13.5",
    "requests==2.32.3",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "pytest-xdist==3.6.1",
    "pytest-rerunfailures==14.0",
]

[tool.pytest.ini_options]
# Centralizes fixtures, variables, and default execution flags
testpaths = ["tests"]
addopts = "-v --html=report.html --self-contained-html"
markers = [
    "ui: marks a test as a UI test (Playwright)",
    "api: marks a test as an API test (httpx)",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"